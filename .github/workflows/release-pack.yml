# Place at: .github/workflows/release-pack.yml in plutonicpeaches/DRIP-s-Custom-Texture-Pack
# On every push to main (or manual run), zips the pack, computes SHA-1, publishes a release,
# and prints the url + sha1 block to paste into plugins/DRIPCore/config.yml.
name: Release resource pack

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

concurrency:
  group: release-pack
  cancel-in-progress: false

env:
  PACK_DIR: ""             # leave empty to auto-detect the folder that contains pack.mcmeta; set a path to force one
  ASSET_NAME: "DRIP_TexturePack.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Locate pack root
        run: |
          echo "Repo top level:"; ls -la
          if [ -z "$PACK_DIR" ]; then
            echo "pack.mcmeta candidates:"; find . -name pack.mcmeta -not -path "./.git/*"
            # shallowest pack.mcmeta wins
            MC=$(find . -name pack.mcmeta -not -path "./.git/*" | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2-)
            [ -n "$MC" ] || { echo "::error::No pack.mcmeta anywhere in the repo - see the listing above"; exit 1; }
            PACK_DIR=$(dirname "$MC")
          fi
          echo "Using PACK_DIR=$PACK_DIR"
          echo "PACK_DIR=$PACK_DIR" >> "$GITHUB_ENV"
          test -f "$PACK_DIR/pack.mcmeta" || { echo "::error::pack.mcmeta not found in $PACK_DIR"; exit 1; }
          test -d "$PACK_DIR/assets"      || { echo "::error::assets/ not found in $PACK_DIR"; exit 1; }
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$PACK_DIR/pack.mcmeta" || { echo "::error::pack.mcmeta is not valid JSON"; exit 1; }

      - name: Build zip
        run: |
          cd "$PACK_DIR"
          # -X strips extra file attrs so identical content gives an identical hash
          zip -X -r -9 "$GITHUB_WORKSPACE/$ASSET_NAME" . \
            -x ".git/*" ".github/*" ".gitattributes" ".gitignore" "README*" "*.md" "*.bbmodel" "*.psd" "*.xcf" ".DS_Store" "Thumbs.db"
          ls -l "$GITHUB_WORKSPACE/$ASSET_NAME"

      - name: Compute SHA-1
        id: hash
        run: echo "sha1=$(sha1sum "$ASSET_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pack-${{ github.run_number }}"
          gh release create "$TAG" "$ASSET_NAME" \
            --title "Pack $TAG" \
            --notes "sha1: ${{ steps.hash.outputs.sha1 }}" \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Paste-ready config
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.rel.outputs.tag }}/${ASSET_NAME}"
          {
            echo "### Resource pack released"
            echo
            echo "Paste into \`plugins/DRIPCore/config.yml\`, then \`/drip reload\` or restart:"
            echo
            echo '```yaml'
            echo "resourcepack:"
            echo "  url: \"$URL\""
            echo "  sha1: \"${{ steps.hash.outputs.sha1 }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
